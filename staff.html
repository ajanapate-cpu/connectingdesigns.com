<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Portal | Connecting Designs</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body,
        body * {
            cursor: url("connecting-cursor.png") 10 26, auto !important;
        }

        body {
            min-height: 100vh;
            background: #08090c url("connecting-logo.png") center / cover fixed no-repeat;
            color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: #000;
        }

        header a {
            color: #f5f5f5;
            font-weight: 700;
            text-decoration: none;
        }

        button {
            padding: 0.75rem 1rem;
            border: 1px solid #454a55;
            border-radius: 0.5rem;
            background: #252830;
            color: #f5f5f5;
            font: 700 1rem Arial, sans-serif;
        }

        button:hover,
        button:focus-visible {
            background: #363a44;
        }

        main {
            min-height: calc(100vh - 3.5rem);
            display: grid;
            place-items: center;
            padding: 2rem;
        }

        article {
            width: min(100%, 700px);
            padding: clamp(2rem, 5vw, 4rem);
            border: 1px solid #454a55;
            border-radius: 1rem;
            background: rgba(10, 11, 14, 0.96);
            text-align: center;
        }

        h1 {
            margin-bottom: 1rem;
        }

        p {
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <header>
        <a href="/">Connecting Designs</a>
        <button id="staff-logout" type="button">Sign Out</button>
    </header>

    <main>
        <article>
            <h1>Staff Portal</h1>
            <p>You are signed in. The staff portal is ready for staff tools and updates.</p>
        </article>
    </main>

    <script>
        document.querySelector("#staff-logout").addEventListener("click", async () => {
            const response = await fetch("/api/staff-logout", { method: "POST" });
            if (!response.ok) {
                throw new Error("Unable to sign out.");
            }
            window.location.assign("/");
        });
    </script>
</body>
</html>
